[pytest]
testpaths = tests
pythonpath = tests
addopts = -ra
markers =
    api: black-box tests against a running API (skipped if unreachable)
    business: B1-B5 sample business questions and RBAC variants
    daily: H1-H12 everyday multi-table questions from Sales and Finance
    security: S1-S3 security suite and A* attack cases
    edge: E1-E11 edge cases
    contract: request/response shape of POST /api/chat
    failure: bad requests and injected upstream failures (LLM, SQL, database)
    budget: latency and cost checks for paths that must be fast or cheap
