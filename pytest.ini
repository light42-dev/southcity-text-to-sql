[pytest]
testpaths = tests
pythonpath = tests
addopts = -ra
markers =
    api: black-box tests against a running API (skipped if unreachable)
    business: B1-B5 sample business questions and RBAC variants
    security: S1-S3 security suite and A* attack cases
    edge: E1-E11 edge cases
    contract: request/response shape of POST /api/chat
